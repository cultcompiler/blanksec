name: blanksec

on:
  workflow_dispatch: {}
  push:
    branches: [blanksec]

jobs:
  cli-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        shell: bash
        run: |
          set +e
          for i in 1 2 3; do
            bun install --linker hoisted && exit 0
            echo "::warning::install attempt $i failed (likely a Windows FS race); cleaning + retrying..."
            rm -rf node_modules
            sleep 8
          done
          exit 1
      - name: Build blanksec CLI (windows, single target)
        run: bun ./packages/opencode/script/build.ts --single
        shell: bash
        env:
          OPENCODE_CHANNEL: dev
          OPENCODE_VERSION: 0.0.0-blanksec
      - name: Show dist
        run: ls -la packages/opencode/dist/
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: blanksec-cli-windows
          path: packages/opencode/dist/opencode-windows*
          if-no-files-found: error
